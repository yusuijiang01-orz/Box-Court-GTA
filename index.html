<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>箱庭小镇 · Diorama Town</title>
<link rel="stylesheet" href="css/style.css?v=40">
</head>
<body>

<canvas id="scene"></canvas>

<!-- ---------------- loading ---------------- -->
<div id="loading">
  <div class="load-inner">
    <div class="load-title">箱庭小镇</div>
    <div class="load-sub">Diorama Town</div>
    <div class="load-track"><div id="loadbar"></div></div>
    <div id="loadtext">准备中…</div>
  </div>
</div>

<!-- ---------------- title ---------------- -->
<div id="titlecard">
  <h1>箱庭小镇</h1>
  <p>海港 · 阶梯小镇 · 昼夜流转</p>
  <div id="fps">—</div>
</div>

<button id="btn-collapse" title="收起/展开面板">›</button>

<!-- ---------------- free-view panel (diorama mode only) ---------------- -->
<div id="panel">

  <section>
    <h2>视角</h2>
    <div class="row wrap">
      <button data-view="overview">全景</button>
      <button data-view="harbour">海港</button>
      <button data-view="square">广场</button>
      <button data-view="terrace">台地</button>
      <button data-view="hill">山顶</button>
      <button data-view="fair">游乐场</button>
      <button data-view="lighthouse">灯塔</button>
    </div>
    <div class="row">
      <button id="btn-spin" class="wide">环绕巡航</button>
    </div>
  </section>

  <section>
    <h2>菜单</h2>
    <div class="row"><button id="btn-panel-settings" class="wide">设置…</button></div>
    <div class="row"><button id="btn-return-game" class="wide ghost">返回游戏</button></div>
  </section>

  <section class="hint">
    <h2>操作</h2>
    <p>左键拖拽旋转 · 右键/Shift 平移 · 滚轮缩放</p>
    <p>空格暂停 · A 昼夜 · R 巡航 · D 动态 · H 面板</p>
  </section>

</div>

<!-- ---------------- scripts (classic, so file:// works) ---------------- -->
<script src="js/vendor/three.min.js"></script>

<script src="js/core/core.js"></script>
<script src="js/core/geo.js"></script>
<script src="js/core/controls.js"></script>

<script src="js/world/sky.js"></script>
<script src="js/world/island.js"></script>
<script src="js/world/roads.js"></script>
<script src="js/world/nature.js"></script>
<script src="js/world/props.js"></script>
<script src="js/world/buildings_home.js"></script>
<script src="js/world/buildings_civic.js"></script>
<script src="js/world/dynamics.js?v=40"></script>
<script src="js/world/fx.js"></script>
<script src="js/world/layout.js"></script>

<script src="js/app.js?v=40"></script>

<script src="js/game/player.js?v=40"></script>
<script src="js/game/input.js?v=40"></script>
<script src="js/game/shell.js?v=40"></script>
<script src="js/game/missions.js?v=1"></script>
<script src="js/game/playability_fix.js?v=2"></script>
<script src="js/game/collision_v1.js?v=2"></script>
<script src="js/game/vehicles.js?v=1"></script>
<script src="js/game/traffic_collision_fix.js?v=1"></script>
<script src="js/game/vehicles_interior.js?v=3"></script>
<script src="js/game/weapons.js?v=1"></script>
<script src="js/game/enemy_ai.js?v=2"></script>
<script src="js/game/gta05_harbour_clear.js?v=1"></script>
<script src="js/game/wanted.js?v=1"></script>
<script src="js/game/gta07_systems.js?v=2"></script>
</body>
</html>
